androidxCollection = "1.5.0"
composeMultiplatform = "1.9.2"
composeShimmer = "1.3.3"
constraintlayout = "0.6.1"
kotlin = "2.2.21"
coil = "3.3.0"

kotlinxCollectionsImmutable = "0.4.0"
